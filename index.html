<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冲刺打卡">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>初三冲刺打卡</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--card2:#1b1f26;--line:#262b33;--txt:#e9ecf1;--dim:#8b939f;--ok:#2fd08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 2px}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--dim);font-size:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.h{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.h:last-child{border-bottom:0}
.box{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid #39414e;display:flex;
align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.15s}
.h.on .box{background:var(--ok);border-color:var(--ok);color:#06231a}
.h.on .name{color:var(--dim);text-decoration:line-through}
.name{font-weight:600}
.sub{font-size:12.5px;color:var(--dim);margin-top:1px}
.bar{height:9px;border-radius:9px;background:#1e232b;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#2fd08a);border-radius:9px;transition:.3s}
.chart{display:flex;align-items:stretch;gap:6px;height:96px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart .bw{flex:1;width:100%;display:flex;align-items:flex-end}
.chart .bw i{display:block;width:100%;background:#2a3140;border-radius:6px;min-height:3px}
.chart .c.ok .bw i{background:linear-gradient(180deg,#2fd08a,#1d9c67)}
.chart span{font-size:11px;color:var(--dim)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.grid4 div{background:var(--card2);border-radius:12px;padding:9px 4px}
.grid4 b{display:block;font-size:17px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:#1e232b;color:var(--dim)}
.pill.ok{background:#12301f;color:#2fd08a}
button{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);
border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
border-radius:12px;padding:10px;font:inherit;resize:vertical;min-height:64px}
ul.days{padding:0;margin:0;list-style:none}
ul.days li{margin:3px 0;font-size:14px;color:#c8ccd4}
#warn{display:none;background:#3a2a12;border:1px solid #6b4c14;color:#ffce6a;border-radius:14px;
padding:12px;margin-bottom:12px;font-size:13.5px}
</style>
</head>
<body>
<div id="warn">⚠️ 当前无法保存数据（可能是用「文件」App 直接打开的）。请按部署步骤放到网上后用 https 打开，否则打卡记录会丢。</div>
<h1>初三冲刺打卡</h1>
<div class="muted" id="sub"></div>
<div id="top" class="card"></div>
<div id="list" class="card"></div>
<div id="sched" class="card"></div>
<div id="stat" class="card"></div>
<div id="chart" class="card"></div>
<div id="weeks" class="card"></div>
<div id="note" class="card"></div>
<div id="data" class="card"></div>

<script>
var KEY='g9_checkin_v1';
var HABITS=[
 {id:'mem',name:'记忆块',sub:'古诗文默写 ＋ 社会背诵',days:[1,2,3,4,5]},
 {id:'drill',name:'限时训练',sub:'计时做题（周末算套卷）',days:[1,2,3,4,5]},
 {id:'err',name:'错题复盘',sub:'只看错题本 ＋ 写明日3个目标',days:[1,2,3,4,5]},
 {id:'read',name:'课外阅读',sub:'≥15 分钟，不查词不记笔记',days:[0,1,2,3,4,5,6]},
 {id:'fit',name:'居家健身',sub:'周二力量A／周四力量B／周末有氧',days:[0,2,4,6]},
 {id:'stretch',name:'睡前拉伸',sub:'体态专项 8 分钟',days:[0,1,2,3,4,5,6]},
 {id:'sleep',name:'23:15 前上床',sub:'睡眠是提分的一部分',days:[0,1,2,3,4,5,6]}
];
var SCHEDULE={
 1:['21:35–22:05 记忆块（古诗文＋社会）','22:05–22:40 限时训练（数学）','22:40–23:00 课外阅读','23:00–23:15 错题复盘＋明日3个目标','23:15–23:30 睡前拉伸＋洗漱'],
 2:['21:20–21:50 居家健身（力量A）','21:50–22:10 洗澡＋加餐','22:10–22:30 记忆块（社会模板＋文言实词）','22:30–23:00 限时训练＋错题（科学）','23:00–23:15 课外阅读','23:15–23:30 睡前拉伸'],
 3:['21:35–22:05 记忆块（古诗文＋社会）','22:05–22:40 限时训练（科学）','22:40–23:00 课外阅读','23:00–23:15 错题复盘＋明日3个目标','23:15–23:30 睡前拉伸＋洗漱'],
 4:['21:20–21:50 居家健身（力量B）','21:50–22:10 洗澡＋加餐','22:10–22:30 记忆块（社会模板＋文言实词）','22:30–23:00 限时训练＋错题（数学）','23:00–23:15 课外阅读','23:15–23:30 睡前拉伸'],
 5:['21:35–22:05 记忆块','22:05–22:40 限时训练','22:40–23:10 一周复盘＋定下周计划','23:15–23:30 睡前拉伸'],
 6:['08:30–10:00 语文专题（现代文阅读＋作文）','10:15–11:45 社会专题（答题模板＋时间轴）','14:00–15:30 理科限时训练','15:40–16:25 居家健身（有氧燃脂）','17:00–18:30 课外阅读（大块）','19:30–21:30 错题二刷'],
 0:['08:30–11:30 限时套卷（语文／社会）','14:00–16:00 弱科专题','16:00–16:45 核心＋体态训练','19:30–21:00 本周总结＋下周计划','21:00–22:30 课外阅读＋放松']
};
var WD=['周日','周一','周二','周三','周四','周五','周六'];
var PLAN_START=new Date(2026,9,12);
var EXAM=new Date(2026,10,9);
var storageOK=true;

function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}

var DB={days:{}};
function load(){
 try{var raw=localStorage.getItem(KEY); if(raw){DB=JSON.parse(raw)||{days:{}}; if(!DB.days)DB.days={};}
     localStorage.setItem(KEY,JSON.stringify(DB));}
 catch(e){storageOK=false;document.getElementById('warn').style.display='block'}
}
function save(){ if(!storageOK)return; try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){} }
function dayRec(ds,create){
 if(!DB.days[ds]){ if(!create)return{done:{},note:''}; DB.days[ds]={done:{},note:''}; }
 var r=DB.days[ds]; if(!r.done)r.done={}; return r;
}
function applicable(d){var w=d.getDay();return HABITS.filter(function(h){return h.days.indexOf(w)>=0})}
function completion(ds){
 var list=applicable(parseYmd(ds)), rec=DB.days[ds]||{done:{}}, n=0;
 for(var i=0;i<list.length;i++){ if(rec.done&&rec.done[list[i].id])n++; }
 return {n:n,total:list.length,pct:list.length?n/list.length:0};
}

function computeStats(){
 var counted=0,sum=0,okDays=0;
 var all=[],cur=new Date(PLAN_START),today=startOfDay(new Date());
 while(cur<=today){all.push(ymd(cur));cur.setDate(cur.getDate()+1)}
 for(var i=0;i<all.length;i++){var c=completion(all[i]);counted++;sum+=c.pct;if(c.pct>=0.8)okDays++}
 var best=0,run=0;
 for(var j=0;j<all.length;j++){ if(completion(all[j]).pct>=0.8){run++;if(run>best)best=run}else run=0 }
 var streak=0;
 for(var k=all.length-1;k>=0;k--){
  if(completion(all[k]).pct>=0.8)streak++;
  else if(k===all.length-1)continue;
  else break;
 }
 return {okDays:okDays,best:best,streak:streak,rate:counted?Math.round(sum/counted*100):0};
}

function render(){
 var now=new Date(), ds=ymd(now), rec=dayRec(ds,true);
 var list=applicable(now), n=0;
 for(var i=0;i<list.length;i++){ if(rec.done[list[i].id])n++; }
 var pct=list.length?n/list.length:0;

 document.getElementById('sub').textContent=WD[now.getDay()]+' · '+(now.getMonth()+1)+'月'+now.getDate()+'日';

 var left=Math.ceil((startOfDay(EXAM)-startOfDay(now))/86400000); if(left<0)left=0;
 document.getElementById('top').innerHTML=
  '<div class="row"><div><div class="muted">距离期中考试</div><div class="big">'+left+' 天</div></div>'+
  '<div style="text-align:right"><div class="muted">今日完成</div><div class="big">'+n+
  '<span style="font-size:17px;color:var(--dim)"> /'+list.length+'</span></div></div></div>'+
  '<div class="bar" style="margin-top:12px"><i style="width:'+Math.round(pct*100)+'%"></i></div>'+
  '<div class="muted" style="margin-top:9px">'+(pct>=0.8?'<span class="pill ok">今日达标</span>':
   '<span class="pill">完成 '+Math.round(pct*100)+'%</span>')+'　完成 80% 以上算达标</div>';

 var h='';
 for(var a=0;a<list.length;a++){var hb=list[a];
  h+='<div class="h'+(rec.done[hb.id]?' on':'')+'" data-id="'+hb.id+'">'+'<div class="box">✓</div>'+
     '<div style="flex:1"><div class="name">'+hb.name+'</div><div class="sub">'+hb.sub+'</div></div></div>';
 }
 document.getElementById('list').innerHTML='<h2>今日打卡</h2>'+h;

 var s=SCHEDULE[now.getDay()]||[], sh='';
 for(var b=0;b<s.length;b++){sh+='<li>· '+s[b]+'</li>'}
 document.getElementById('sched').innerHTML='<h2>今日安排</h2><ul class="days">'+sh+'</ul>';

 var st=computeStats();
 document.getElementById('stat').innerHTML='<h2>统计</h2><div class="grid4">'+
  '<div><b>'+st.streak+'</b><span class="muted">连续达标</span></div>'+
  '<div><b>'+st.best+'</b><span class="muted">最长连击</span></div>'+
  '<div><b>'+st.okDays+'</b><span class="muted">达标天数</span></div>'+
  '<div><b>'+st.rate+'%</b><span class="muted">总完成率</span></div></div>';

 var cells='';
 for(var c=6;c>=0;c--){
  var d=new Date(now); d.setDate(d.getDate()-c);
  var cc=completion(ymd(d));
  cells+='<div class="c'+(cc.pct>=0.8?' ok':'')+'"><div class="bw"><i style="height:'+
   Math.max(3,Math.round(cc.pct*100))+'%"></i></div><span>'+d.getDate()+'</span></div>';
 }
 document.getElementById('chart').innerHTML='<h2>最近 7 天</h2><div class="chart">'+cells+'</div>';

 var wh='';
 for(var w=0;w<4;w++){
  var s1=new Date(PLAN_START); s1.setDate(s1.getDate()+w*7);
  var e1=new Date(s1); e1.setDate(e1.getDate()+6);
  var sum=0,cnt=0,cur=new Date(s1);
  while(cur<=e1){ var y=ymd(cur); if(y>ds)break; sum+=completion(y).pct; cnt++; cur.setDate(cur.getDate()+1) }
  var p=cnt?Math.round(sum/cnt*100):0;
  wh+='<div><b>'+p+'%</b><span class="muted">W'+(w+1)+'</span></div>';
 }
 document.getElementById('weeks').innerHTML='<h2>四周进度</h2><div class="grid4">'+wh+'</div>';

 document.getElementById('note').innerHTML='<h2>今日备注</h2><textarea id="nb" placeholder="今天最大的收获 / 明天要改的一件事"></textarea>';
 var nb=document.getElementById('nb');
 nb.value=rec.note||'';
 nb.oninput=function(){rec.note=nb.value;save()};

 document.getElementById('data').innerHTML='<h2>数据</h2><div class="btnrow">'+
  '<button id="exp">导出备份</button><button id="imp">导入备份</button><button id="rst">清空全部</button></div>'+
  '<input type="file" id="file" accept=".json,application/json" style="display:none">'+
  '<div class="muted" style="margin-top:9px">数据只存在这台手机里。换手机或清缓存之前，先点「导出备份」。</div>';

 var els=document.querySelectorAll('.h');
 for(var q=0;q<els.length;q++){
  els[q].onclick=(function(el){return function(){
   var t=dayRec(ymd(new Date()),true), id=el.getAttribute('data-id');
   if(t.done[id]){delete t.done[id]}else{t.done[id]=true}
   save(); render();
  }})(els[q]);
 }

 document.getElementById('exp').onclick=function(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='checkin-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1500);
 };
 document.getElementById('imp').onclick=function(){document.getElementById('file').click()};
 document.getElementById('file').onchange=function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
   try{
    var o=JSON.parse(r.result);
    if(o&&o.days){ for(var k in o.days){ DB.days[k]=o.days[k] } save(); render(); alert('导入成功') }
    else alert('文件格式不对')
   }catch(err){alert('解析失败：'+err.message)}
  };
  r.readAsText(f);
 };
 document.getElementById('rst').onclick=function(){
  if(confirm('确定清空所有打卡记录？此操作无法撤销。')){
   DB={days:{}}; save(); dayRec(ymd(new Date()),true); render();
  }
 };
}

load(); render();
</script>
</body>
</html>
